<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 nothing. </title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

:root{
    --bg:#000000;
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.08);
    --text:#ffe8f1;
    --accent:#ff9fc8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
}

/* AMOLED Background */
body{
    background:
    radial-gradient(circle at 20% 20%, rgba(255,105,180,.06), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(255,182,193,.05), transparent 30%),
    #000;
}

/* Sakura Layer */
#sakura-layer{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.petal{
    position:absolute;
    top:-10vh;
    color:#ffbfd7;
    opacity:.65;
    will-change:transform;
    user-select:none;

    animation-name:fall,sway;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite;
}

@keyframes fall{
    from{
        transform:
            translate3d(0,-10vh,0)
            rotate(0deg);
    }
    to{
        transform:
            translate3d(-150px,110vh,0)
            rotate(720deg);
    }
}

@keyframes sway{
    0%{ margin-left:0; }
    50%{ margin-left:80px; }
    100%{ margin-left:0; }
}

/* Glass Glow */
.glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(circle,
    rgba(255,140,180,.10),
    transparent 70%);
    filter:blur(80px);
    pointer-events:none;
    z-index:2;
}

/* Main App */
.app{
    position:relative;
    z-index:10;

    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    background:rgba(0,0,0,.15);
}

/* Header */
.header{
    height:72px;
    min-height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    border-bottom:1px solid rgba(255,255,255,.06);

    background:rgba(255,255,255,.02);
    backdrop-filter:blur(30px);
}

.title{
    color:var(--text);
    font-size:1.15rem;
    font-weight:800;
    letter-spacing:.3px;
}

.status{
    color:var(--accent);
    font-size:.9rem;
    font-weight:700;
}

/* Notes */
textarea{
    flex:1;

    width:100%;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    color:var(--text);

    font-size:19px;
    font-weight:700;

    line-height:1.95;

    padding:40px;

    resize:none;

    caret-color:#ff9fc8;
}

textarea::placeholder{
    color:rgba(255,230,240,.28);
    font-weight:600;
}

textarea::-webkit-scrollbar{
    width:8px;
}

textarea::-webkit-scrollbar-thumb{
    background:rgba(255,180,210,.15);
    border-radius:999px;
}

/* Bottom fade */
.bottom-fade{
    position:absolute;
    bottom:0;
    left:0;
    right:0;

    height:120px;

    pointer-events:none;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.4)
    );
}

/* Mobile */
@media(max-width:768px){

    .title{
        font-size:1rem;
    }

    textarea{
        padding:25px;
        font-size:17px;
    }
}
</style>
</head>
<body>

<div id="sakura-layer"></div>

<div class="glow" id="glow"></div>

<div class="app">

    <div class="header">
        <div class="title">🌸 just nothing. </div>
        <div class="status" id="status">Ready</div>
    </div>

    <textarea
        id="notes"
        placeholder="Write your thoughts, dreams, plans..."
    ></textarea>

    <div class="bottom-fade"></div>

</div>

<script>

/* =========================
   Local Storage Save
========================= */

const notes = document.getElementById("notes");
const status = document.getElementById("status");

notes.value =
localStorage.getItem("sakura_journal") || "";

let saveTimeout;

notes.addEventListener("input",()=>{

    localStorage.setItem(
        "sakura_journal",
        notes.value
    );

    status.textContent = "Saved ✓";

    clearTimeout(saveTimeout);

    saveTimeout = setTimeout(()=>{
        status.textContent = "Ready";
    },1200);
});

/* =========================
   Smooth Sakura Generator
========================= */

const layer =
document.getElementById("sakura-layer");

const petals = 55;

for(let i=0;i<petals;i++){

    const petal =
    document.createElement("div");

    petal.className = "petal";

    const icons = [
        "❀",
        "✿",
        "❁",
        "🌸"
    ];

    petal.textContent =
    icons[
        Math.floor(
            Math.random()*icons.length
        )
    ];

    const size =
    12 + Math.random()*20;

    petal.style.fontSize =
    size + "px";

    petal.style.left =
    Math.random()*100 + "vw";

    const fallDuration =
    18 + Math.random()*25;

    const swayDuration =
    4 + Math.random()*8;

    petal.style.animationDuration =
    `${fallDuration}s, ${swayDuration}s`;

    petal.style.animationDelay =
    `${-Math.random()*40}s, 0s`;

    petal.style.opacity =
    0.25 + Math.random()*0.5;

    layer.appendChild(petal);
}

/* =========================
   Floating Glow
========================= */

const glow =
document.getElementById("glow");

let mouseX =
window.innerWidth/2;

let mouseY =
window.innerHeight/2;

window.addEventListener(
'mousemove',
e=>{
    mouseX = e.clientX;
    mouseY = e.clientY;
}
);

function animateGlow(){

    const x =
    mouseX - 250;

    const y =
    mouseY - 250;

    glow.style.transform =
    `translate(${x}px,${y}px)`;

    requestAnimationFrame(
        animateGlow
    );
}

animateGlow();

/* =========================
   Auto Focus
========================= */

window.onload = ()=>{
    notes.focus();
};

</script>

</body>
</html>
